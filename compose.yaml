services:
  mysql:
    image: mysql:8.0
    container_name: streamlist-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}     
      MYSQL_DATABASE: ${MYSQL_DATABASE}               
      MYSQL_USER: ${DB_USER}                          
      MYSQL_PASSWORD: ${DB_PASSWORD}                  
    volumes:
      - streamlist:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - streamlist-network

  phpmyadmin:
    image: phpmyadmin
    container_name: streamlist-phpmyadmin
    environment:
      PMA_HOST: streamlist-mysql
      UPLOAD_LIMIT: 100M
    ports:
      - "8080:80"
    networks:
      - streamlist-network

volumes:
  streamlist:

networks:
  streamlist-network: